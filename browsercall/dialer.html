<style>
  .browsercall .browsercall-intro { color: #444; }
  .browsercall .browsercall-status { padding: 0.5rem 0.75rem; border-radius: 4px;
                                     background: #e7f3ff; border: 1px solid #bcdfff; margin: 0.75rem 0; }
  .browsercall .browsercall-status[data-level="success"] { background: #e6f7ea; border-color: #b6e2c2; }
  .browsercall .browsercall-status[data-level="warning"] { background: #fff5d6; border-color: #f0d780; }
  .browsercall .browsercall-status[data-level="danger"]  { background: #fde2e2; border-color: #f0b4b4; color: #8a1f1f; }
  .browsercall .browsercall-form label { display: block; margin-top: 0.5rem; font-weight: 600; }
  .browsercall .browsercall-form input[type=tel] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
  .browsercall .browsercall-buttons { margin-top: 0.75rem; display: flex; gap: 0.5rem; }
  .browsercall .browsercall-buttons button { padding: 0.4rem 0.9rem; font-size: 1rem; cursor: pointer; }
  .browsercall .browsercall-buttons button[disabled] { opacity: 0.5; cursor: default; }
  .browsercall .browsercall-keypad { display: grid; grid-template-columns: repeat(3, minmax(4.5rem, 1fr));
                                     gap: 0.5rem; margin-top: 1rem; }
  .browsercall .browsercall-key { min-height: 4rem; padding: 0.75rem; border: 1px solid #bbb;
                                  border-radius: 6px; background: #f8f8f8; color: #222;
                                  box-shadow: 0 2px 0 #d0d0d0; font-size: 1.45rem;
                                  font-weight: 600; cursor: pointer;
                                  transition: background 100ms ease, border-color 100ms ease,
                                              box-shadow 100ms ease, transform 100ms ease; }
  .browsercall .browsercall-key:hover:not([disabled]),
  .browsercall .browsercall-key:focus-visible:not([disabled]) { background: #d9ecff; border-color: #4c98d8;
                                                                box-shadow: 0 3px 0 #9fbfda;
                                                                transform: translateY(-1px); }
  .browsercall .browsercall-key:active:not([disabled]) { background: #9fc8ed; border-color: #347ebc;
                                                         box-shadow: 0 0 0 #d0d0d0; transform: translateY(2px); }
  .browsercall .browsercall-key[disabled] { opacity: 0.45; cursor: default; }
</style>
<div class="browsercall"
     data-generated-by="logrole/browsercall"
     data-source="{{ .SourceURL }}"
     {{- if .SourceVersion }} data-version="{{ .SourceVersion }}"{{ end }}>
  <p class="browsercall-intro">Place an outbound call from your browser.
    {{- if .From }} Calls show the caller ID <strong>{{ .From }}</strong>.{{ end }}
  </p>
  <div id="browsercall-status" class="browsercall-status" role="status">Initializing&hellip;</div>
  <form id="browsercall-form" class="browsercall-form">
    <label for="browsercall-to">To</label>
    <input type="tel" inputmode="tel" name="to" id="browsercall-to" placeholder="+15557654321" autocomplete="tel" autofocus />
    <div class="browsercall-buttons">
      <button type="button" id="browsercall-call" disabled>Call</button>
      <button type="button" id="browsercall-hangup" disabled>Hang up</button>
    </div>
    <div class="browsercall-keypad" aria-label="Call keypad">
      <button type="button" class="browsercall-key" data-digit="1" aria-label="Send digit 1" disabled>1</button>
      <button type="button" class="browsercall-key" data-digit="2" aria-label="Send digit 2" disabled>2</button>
      <button type="button" class="browsercall-key" data-digit="3" aria-label="Send digit 3" disabled>3</button>
      <button type="button" class="browsercall-key" data-digit="4" aria-label="Send digit 4" disabled>4</button>
      <button type="button" class="browsercall-key" data-digit="5" aria-label="Send digit 5" disabled>5</button>
      <button type="button" class="browsercall-key" data-digit="6" aria-label="Send digit 6" disabled>6</button>
      <button type="button" class="browsercall-key" data-digit="7" aria-label="Send digit 7" disabled>7</button>
      <button type="button" class="browsercall-key" data-digit="8" aria-label="Send digit 8" disabled>8</button>
      <button type="button" class="browsercall-key" data-digit="9" aria-label="Send digit 9" disabled>9</button>
      <button type="button" class="browsercall-key" data-digit="*" aria-label="Send star" disabled>*</button>
      <button type="button" class="browsercall-key" data-digit="0" aria-label="Send digit 0" disabled>0</button>
      <button type="button" class="browsercall-key" data-digit="#" aria-label="Send pound" disabled>#</button>
    </div>
  </form>
</div>
<script src="{{ .ScriptURL }}"></script>
<script type="text/javascript">
(function() {
  var tokenURL = {{ .TokenPath }};
  var statusEl = document.getElementById('browsercall-status');
  var formEl = document.getElementById('browsercall-form');
  var callBtn = document.getElementById('browsercall-call');
  var hangupBtn = document.getElementById('browsercall-hangup');
  var toInput = document.getElementById('browsercall-to');
  var keypadBtns = document.querySelectorAll('.browsercall-key');
  var device = null;
  var activeCall = null;
  var tokenData = null;
  // Twilio's Device 'error' event carries the richest description of
  // signaling-level failures (e.g. AccessTokenInvalid). connect()'s promise
  // can reject with a bare/undefined reason for the same failure, so we
  // remember the last device error and fall back to it when formatting.
  var lastDeviceError = null;

  function setStatus(msg, level) {
    statusEl.textContent = msg;
    statusEl.setAttribute('data-level', level || 'info');
  }
  function formatError(err) {
    if (!err) { return lastDeviceError ? formatError(lastDeviceError) : 'unknown error'; }
    var msg = err.message || err.description || String(err);
    return err.code ? msg + ' (' + err.code + ')' : msg;
  }
  function setBusy(busy) {
    callBtn.disabled = busy;
    hangupBtn.disabled = !busy;
    toInput.disabled = busy;
    if (!busy) { setKeypadEnabled(false); }
  }
  function setKeypadEnabled(enabled) {
    for (var i = 0; i < keypadBtns.length; i++) {
      keypadBtns[i].disabled = !enabled;
    }
  }
  function fetchToken() {
    return fetch(tokenURL, {credentials: 'same-origin'}).then(function(r) {
      if (!r.ok) { throw new Error('token request failed: ' + r.status); }
      return r.json();
    });
  }
  function installDeviceHandlers() {
    device.on('error', function(err) {
      lastDeviceError = err;
      setStatus('Device error: ' + formatError(err), 'danger');
      setBusy(false);
    });
    device.on('tokenWillExpire', function() {
      fetchToken().then(function(d) {
        tokenData = d;
        device.updateToken(d.token);
      }).catch(function(err) {
        setStatus('Could not refresh token: ' + err.message, 'danger');
      });
    });
  }
  function ensureDevice() {
    if (device) { return device; }
    if (!tokenData) { throw new Error('access token is not ready yet'); }
    // Construct Twilio.Device inside the click handler. Browsers can block
    // the SDK's AudioContext if the device is created during page load.
    device = new Twilio.Device(tokenData.token, {
      codecPreferences: ['opus', 'pcmu'],
      logLevel: 'warn',
    });
    installDeviceHandlers();
    return device;
  }
  function attachCallHandlers(call) {
    activeCall = call;
    setBusy(true);
    setKeypadEnabled(false);
    call.on('accept', function() { setStatus('Call connected.', 'success'); setKeypadEnabled(true); });
    call.on('disconnect', function() { activeCall = null; setStatus('Call ended.', 'info'); setBusy(false); });
    call.on('cancel', function() { activeCall = null; setStatus('Call canceled.', 'warning'); setBusy(false); });
    call.on('reject', function() { activeCall = null; setStatus('Call rejected.', 'warning'); setBusy(false); });
    call.on('error', function(err) { activeCall = null; setStatus('Call error: ' + formatError(err), 'danger'); setBusy(false); });
  }

  fetchToken()
    .then(function(data) {
      tokenData = data;
      setStatus('Ready (identity ' + data.identity + ').', 'success');
      callBtn.disabled = false;
    })
    .catch(function(err) { setStatus('Could not initialize: ' + err.message, 'danger'); });

  function placeCall() {
    // Ignore activation while the call button is disabled (token not ready,
    // or a call is already in progress). This guards the Enter-key path,
    // since a disabled button never fires its own click event.
    if (callBtn.disabled) { return; }
    var to = toInput.value.trim();
    if (!to) { return; }
    setStatus('Dialing ' + to + '…', 'info');
    setBusy(true);
    var d;
    try {
      d = ensureDevice();
    } catch (err) {
      setStatus('Could not initialize: ' + (err && err.message || err), 'danger');
      setBusy(false);
      return;
    }
    d.connect({params: {To: to}}).then(attachCallHandlers).catch(function(err) {
      setStatus('Could not place call: ' + formatError(err), 'danger');
      setBusy(false);
    });
  }

  function sendDigit(digit) {
    if (!activeCall || !digit) { return; }
    if (typeof activeCall.sendDigits !== 'function') {
      setStatus('Keypad unavailable for this call.', 'danger');
      setKeypadEnabled(false);
      return;
    }
    try {
      activeCall.sendDigits(digit);
      setStatus('Sent keypad digit.', 'success');
    } catch (err) {
      setStatus('Could not send keypad digit: ' + (err && err.message || err), 'danger');
    }
  }

  callBtn.addEventListener('click', placeCall);
  // Pressing Enter in the To field submits the form; place the call instead
  // of letting the browser navigate.
  formEl.addEventListener('submit', function(e) { e.preventDefault(); placeCall(); });
  for (var i = 0; i < keypadBtns.length; i++) {
    keypadBtns[i].addEventListener('click', function(e) {
      sendDigit(e.currentTarget.getAttribute('data-digit'));
    });
  }
  hangupBtn.addEventListener('click', function() {
    if (activeCall) { activeCall.disconnect(); }
    else if (device) { device.disconnectAll(); }
  });
})();
</script>
