env:
  TZ: UTC
  # staticcheck v0.7.x can't read Go 1.27 export data ("export data
  # version 4 is greater than maximum supported version 2"); v0.8.1 is
  # the first tagged release with the fix, so pin to it instead of
  # floating on master.
  STATICCHECK_VERSION: "v0.8.1"
  DIFFER_VERSION: "v1.4.0"

steps:
  - label: ":go: Format"
    key: "format"
    command: ".buildkite/ci/format.sh"
    timeout_in_minutes: 10
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/format/**/*"

  - label: ":go: Lint"
    key: "lint"
    command: ".buildkite/ci/lint.sh"
    timeout_in_minutes: 10
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/lint/**/*"

  - label: ":package: Assets"
    key: "assets"
    command: ".buildkite/ci/assets.sh"
    timeout_in_minutes: 10
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/assets/**/*"

  - label: ":go: Test"
    key: "test"
    command: ".buildkite/ci/test.sh"
    timeout_in_minutes: 15
    agents:
      pool: "ci"
    artifact_paths:
      - "coverage/**/*"
      - "reports/tests/**/*"

  - label: ":go: Build"
    key: "build"
    command: ".buildkite/ci/build.sh"
    timeout_in_minutes: 10
    depends_on:
      - "format"
      - "lint"
      - "assets"
      - "test"
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/build/**/*"
      - "tmp/dist/**/*"
